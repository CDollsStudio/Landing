<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CyberDolls Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bagel+Fat+One&family=Alfa+Slab+One&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a2271;
  --navy-deep:#0f1550;
  --cream:#eee6d3;
  --glow:#7f8fff;
  --glass:rgba(140,160,255,0.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
html, body{ height:100%; overscroll-behavior:none; }
html{scroll-behavior:smooth;}
body{
  font-family:'Manrope',sans-serif;
  color:var(--navy-deep);
  background:#dcd9d2;
  overflow:hidden;
}

/* ── procedural newsprint canvas — this is the fallback layer, always present ── */
#news-bg{
  position:fixed; inset:0; z-index:-2;
  width:100%; height:100%;
  background-color:#dcd9d2;
  background-image:
    radial-gradient(rgba(26,34,113,0.10) 1px, transparent 1px),
    radial-gradient(rgba(26,34,113,0.06) 1px, transparent 1px);
  background-size: 6px 6px, 6px 6px;
  background-position: 0 0, 3px 3px;
}
#news-bg::after{
  content:"";
  position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(220,217,210,0) 30%, rgba(220,217,210,0) 70%, rgba(255,255,255,0.4));
}
/* real newsprint wallpaper photo, layered on top of the fallback — if wpL.png / wpP.png
   fail to load this just never appears and the dot pattern above shows through instead */
#news-bg-photo{
  position:fixed; inset:0; z-index:-1;
  width:100%; height:100%;
  object-fit:cover;
  filter: contrast(1.05);
}

/* ── pixel outline helper ── */
.pixel{
  font-family:'Press Start 2P', monospace;
  color:#fff;
  -webkit-text-stroke: 2px var(--navy);
  text-shadow:
    2px 0 var(--navy), -2px 0 var(--navy), 0 2px var(--navy), 0 -2px var(--navy),
    0 0 14px var(--glow), 0 0 26px rgba(127,143,255,0.6);
  letter-spacing:0.02em;
}

/* ── hero ── */
.hero{
  position:relative;
  height:100svh;
  min-height:100svh;
  display:flex;
  align-items:center;
  overflow:hidden;
  padding: 90px 4vw 40px;
}

/* nav list */
.hero-nav{
  position:relative; z-index:5;
  display:flex; flex-direction:column;
  gap: clamp(18px,3vw,34px);
  max-width: 40%;
}
.hero-nav a{
  font-size: clamp(14px,2.1vw,26px);
  line-height:1.3;
  text-decoration:none;
  display:inline-block;
  transform: skewY(-3deg);
  transition: transform .35s cubic-bezier(.34,1.56,.64,1), filter .3s ease;
  cursor:pointer;
}
.hero-nav a:nth-child(odd){ transform: skewY(-3deg) rotate(-1.5deg); }
.hero-nav a:nth-child(even){ transform: skewY(-3deg) rotate(1.2deg); margin-left: clamp(6px,1.5vw,20px); }
.hero-nav a:hover, .hero-nav a.cursor-target{
  transform: skewY(-3deg) scale(1.08) translateY(-3px);
  filter: brightness(1.15);
}

/* center wordmark cluster */
.mark-wrap{
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%);
  z-index:4;
  width:min(56vw,640px);
  display:flex; flex-direction:column; align-items:center;
}
.orbit-svg{ position:absolute; inset:-18% -10%; width:130%; height:130%; z-index:1; pointer-events:none; }
.orbit-path{
  fill:none; stroke:var(--navy); stroke-width:3;
  stroke-dasharray: 900;
  stroke-dashoffset: 900;
  animation: draw 2.2s ease forwards .3s;
}
@keyframes draw{ to{ stroke-dashoffset:0; } }

.sparkle{
  position:absolute; width:34px; height:34px;
  animation: sparkleSpin 6s linear infinite, sparklePulse 1.8s ease-in-out infinite;
  transform-origin:center;
  z-index:2;
}
@keyframes sparkleSpin{ to{ transform: rotate(360deg); } }
@keyframes sparklePulse{ 0%,100%{ opacity:.7; } 50%{ opacity:1; } }

/* bubbles — real bubble.png photo, with a CSS glass-circle fallback if it fails to load */
.bubble{
  position:absolute; border-radius:50%;
  overflow:hidden;
  animation: bob 3.4s cubic-bezier(.68,-0.4,.27,1.4) infinite;
  z-index:2;
}
.bubble img{
  width:100%; height:100%; object-fit:cover; display:block;
}
.bubble .bubble-fallback{
  width:100%; height:100%; border-radius:50%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95), var(--glass) 55%, rgba(120,140,255,0.15) 100%);
  border:1px solid rgba(255,255,255,0.7);
  box-shadow: inset 0 0 10px rgba(255,255,255,0.6), 0 4px 10px rgba(26,34,113,0.15);
  display:none;
}
@keyframes bob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-16px); } }

.wordmark{
  position:relative; z-index:3;
  font-family:'Bagel Fat One', 'Alfa Slab One', serif;
  font-size: clamp(48px, 8.6vw, 112px);
  line-height:0.92;
  color:var(--cream);
  -webkit-text-stroke: 2px var(--navy);
  text-shadow: 5px 6px 0 var(--navy), 5px 6px 20px rgba(26,34,113,0.4);
  text-align:center;
  letter-spacing:-0.01em;
  animation: bobSlow 5s ease-in-out infinite;
}
@keyframes bobSlow{ 0%,100%{ transform: translateY(0) rotate(0deg); } 50%{ transform: translateY(-8px) rotate(-0.6deg); } }

.subword{
  position:relative; z-index:3;
  font-family:'Bagel Fat One', 'Alfa Slab One', serif;
  font-size: clamp(16px, 2.6vw, 30px);
  letter-spacing: 0.5em;
  color: var(--navy);
  margin-top: 8px;
  margin-left: 0.5em;
}

/* photo — bleeds off the bottom-right corner, real photo with a fallback if missing */
.photo-slot{
  position:absolute; right:-3vw; bottom:-4vh;
  z-index:3;
  width: min(34vw, 430px);
  display:flex; align-items:flex-end; justify-content:flex-end;
  animation: bobPhoto 4.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes bobPhoto{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-10px); } }
.photo-slot img{
  width:100%; height:auto; max-height:88vh; object-fit:contain; object-position:bottom right;
  display:block;
  filter: drop-shadow(-6px 10px 18px rgba(15,21,80,0.35));
}
.photo-placeholder{
  width:100%; height:78vh; border-radius:40% 60% 55% 45%/50% 45% 55% 50%;
  background: radial-gradient(circle at 40% 25%, #efe8db, #cfc6b3 55%, #b8ae9c 100%);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
  border:3px dashed rgba(26,34,113,0.35);
  overflow:hidden;
}
.photo-placeholder svg{ width:56%; height:auto; }
.photo-placeholder span{
  font-family:'Press Start 2P', monospace; font-size:9px; letter-spacing:.08em;
  color: var(--navy); text-align:center; padding:0 30px;
}

.pixel-cursor{
  position:absolute; z-index:6; top:0; left:0;
  width: clamp(60px,9vw,110px);
  filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.25));
  will-change: top, left, opacity, transform;
}
.pixel-cursor .bob{
  animation: cursorBob 2.2s cubic-bezier(.68,-0.4,.27,1.4) infinite;
  transform-origin: 12% 10%;
}
@keyframes cursorBob{ 0%,100%{ transform: translate(0,0) rotate(0deg); } 50%{ transform: translate(-6px,-10px) rotate(-4deg); } }

.pixel-cursor.disintegrate .bob{
  animation: none;
}
.pixel-cursor.disintegrate{
  animation: disintegrate .7s ease forwards;
}
@keyframes disintegrate{
  0%{ opacity:1; filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.25)) blur(0px); }
  40%{ opacity:.7; filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.15)) blur(1.5px); }
  100%{ opacity:0; transform: translateY(26px) scale(.5) rotate(20deg); filter: blur(6px); }
}

/* everything stays absolutely positioned at every size so the page never scrolls —
   we just scale it down instead of letting it stack and grow taller than the screen */
@media(max-width:860px){
  .hero-nav{ max-width:58%; gap:14px; }
  .mark-wrap{ width:min(66vw,420px); }
  .photo-slot{ width:44vw; right:-2vw; bottom:-2vh; }
  .pixel-cursor{ display:none; }
}
@media(max-width:560px){
  .hero-nav{ max-width:60%; gap:10px; }
  .hero-nav a{ font-size: clamp(9px,3vw,13px); }
  .wordmark{ font-size: clamp(28px,10vw,44px); }
  .subword{ font-size: clamp(11px,3vw,16px); }
  .photo-slot{ width:52vw; }
}

footer.credit{
  position:absolute; left:0; right:0; bottom:10px; z-index:2;
  text-align:center;
  font-family:'Press Start 2P', monospace; font-size:8px; letter-spacing:.1em; color:var(--navy);
  opacity:0.75;
}
</style>
</head>
<body>

<div id="news-bg"></div>
<img id="news-bg-photo" src="" alt="" onerror="this.style.display='none';">

<div class="hero">
  <nav class="hero-nav" id="heroNav">
    <a href="about.html" class="pixel">ABOUT ME</a>
    <a href="mission.html" class="pixel">CDS MISSION<br>STATEMENT</a>
    <a href="services.html" class="pixel">SERVICES</a>
    <a href="inquiries.html" class="pixel">INQUIRIES</a>
    <a href="newsletter.html" class="pixel">NEWSLETTER</a>
  </nav>

  <div class="mark-wrap">
    <svg class="orbit-svg" viewBox="0 0 600 400">
      <path class="orbit-path" d="M 60 260 C 140 60, 420 40, 540 160 C 600 220, 560 260, 520 240" />
    </svg>
    <div class="sparkle" style="top:6%; left:32%;">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#1a2271"/></svg>
    </div>
    <div class="bubble" style="width:52px;height:52px; left:2%; top:44%; animation-delay:.2s;">
      <img src="assets/bubble.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="bubble-fallback"></div>
    </div>
    <div class="bubble" style="width:30px;height:30px; left:14%; top:30%; animation-delay:1s;">
      <img src="assets/bubble.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="bubble-fallback"></div>
    </div>
    <div class="bubble" style="width:36px;height:36px; right:8%; bottom:14%; animation-delay:.6s;">
      <img src="assets/bubble.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="bubble-fallback"></div>
    </div>
    <div class="bubble" style="width:22px;height:22px; right:18%; bottom:2%; animation-delay:1.4s;">
      <img src="assets/bubble.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="bubble-fallback"></div>
    </div>

    <div class="wordmark">CYBERDOLLS</div>
    <div class="subword">STUDIO</div>
  </div>

  <div class="photo-slot">
    <img src="assets/photo.jpg" alt="Ali" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="photo-placeholder" style="display:none;">
      <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="96" rx="52" ry="58" fill="#1a2271" opacity="0.85"/>
        <path d="M40 230 C 40 160 60 130 100 130 C 140 130 160 160 160 230 Z" fill="#1a2271" opacity="0.85"/>
        <circle cx="80" cy="90" r="5" fill="#eee6d3"/>
        <circle cx="120" cy="90" r="5" fill="#eee6d3"/>
        <path d="M78 112 Q100 124 122 112" stroke="#eee6d3" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
      <span>DROP A PHOTO HERE<br>(assets/photo.jpg)</span>
    </div>
  </div>

  <div class="pixel-cursor" id="pixelCursor">
    <svg class="bob" viewBox="0 0 32 32" fill="none">
      <path d="M4 2 L4 26 L10 20 L14 29 L18 27 L14 18 L22 18 Z" fill="#ffffff" stroke="#1a2271" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>
  </div>

  <footer class="credit">© CYBERDOLLS STUDIO — EST. TEXAS</footer>
</div>

<script>
/* ── pick the landscape or portrait wallpaper based on viewport orientation ── */
(function(){
  const img = document.getElementById('news-bg-photo');
  if(!img) return;
  let current = null;
  function pickWallpaper(){
    const wantPortrait = window.innerHeight > window.innerWidth;
    const file = wantPortrait ? 'assets/wpP.png' : 'assets/wpL.png';
    if(file !== current){
      current = file;
      img.style.display = '';
      img.src = file;
    }
  }
  pickWallpaper();
  window.addEventListener('resize', pickWallpaper);
  window.addEventListener('orientationchange', pickWallpaper);
})();

/* ── cursor that walks down the nav list, holds 5s per item, then
   disintegrates once it runs past the last option and re-appears at top ── */
(function(){
  const hero = document.querySelector('.hero');
  const cursor = document.getElementById('pixelCursor');
  const links = Array.from(document.querySelectorAll('#heroNav a'));
  if(!hero || !cursor || links.length === 0) return;

  let idx = 0;
  const HOLD_MS = 5000;
  const DISINTEGRATE_MS = 700;

  function placeAt(el, animate){
    const heroBox = hero.getBoundingClientRect();
    const linkBox = el.getBoundingClientRect();
    // tip of the cursor points up-left at the text
    const top = (linkBox.top - heroBox.top) + linkBox.height * 0.25;
    const left = (linkBox.right - heroBox.left) + 6;
    cursor.style.transition = animate
      ? 'top .85s cubic-bezier(.34,1.56,.64,1), left .85s cubic-bezier(.34,1.56,.64,1), opacity .5s ease'
      : 'none';
    cursor.style.top = top + 'px';
    cursor.style.left = left + 'px';
  }

  function highlight(el){
    links.forEach(l => l.classList.remove('cursor-target'));
    if(el) el.classList.add('cursor-target');
  }

  function step(){
    if(idx < links.length){
      const el = links[idx];
      placeAt(el, true);
      highlight(el);
      idx++;
    } else {
      // walked past the last option — disintegrate, then reset to top
      highlight(null);
      cursor.classList.add('disintegrate');
      setTimeout(()=>{
        cursor.classList.remove('disintegrate');
        idx = 0;
        placeAt(links[0], false);
        cursor.style.opacity = '0';
        // force reflow so the opacity:0 actually applies before we fade in
        void cursor.offsetWidth;
        cursor.style.transition = 'opacity .6s ease';
        cursor.style.opacity = '1';
        highlight(links[0]);
        idx = 1;
      }, DISINTEGRATE_MS);
    }
  }

  // initial placement once fonts/layout settle
  window.addEventListener('load', ()=>{
    placeAt(links[0], false);
    highlight(links[0]);
    idx = 1;
    setInterval(step, HOLD_MS);
  });

  // keep the cursor glued to the right spot on resize
  window.addEventListener('resize', ()=>{
    const current = links[(idx - 1 + links.length) % links.length];
    if(current) placeAt(current, false);
  });
})();
</script>

</body>
</html>
